services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8090:8080"
    volumes:
      - ./frontend-legacy:/app/frontend-legacy:ro
      - /var/run/webdesk.sock:/var/run/webdesk.sock
    environment:
      - HOST_AGENT_SOCKET=/var/run/webdesk.sock
      - GIN_MODE=release
      # Authentication (temporary, until PAM). If a users file exists at
      # WEBDESK_USERS_FILE (default /etc/webdesk/users) it takes precedence;
      # otherwise these env credentials are used. Override in a .env file or
      # your shell — do not ship these defaults to production.
      - WEBDESK_USER=${WEBDESK_USER:-admin}
      - WEBDESK_PASSWORD=${WEBDESK_PASSWORD:-changeme}
      # To use a users file instead, mount it and point WEBDESK_USERS_FILE at it:
      # - WEBDESK_USERS_FILE=/etc/webdesk/users
      # Set to 1 when serving over HTTPS so the session cookie gets the Secure flag.
      - WEBDESK_SECURE_COOKIE=${WEBDESK_SECURE_COOKIE:-0}
    # volumes example for a users file:
    #   - ./webdesk-users:/etc/webdesk/users:ro
    restart: unless-stopped
    networks:
      - webdesk

  frontend:
    build:
      context: frontend
      dockerfile: .docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    networks:
      - webdesk
    depends_on:
      - backend

networks:
  webdesk:
    driver: bridge
