server:
  socket_path: "/var/run/webdesk.sock"
  socket_permissions: 0o660
  socket_group: "webdesk"

security:
  allowed_paths:
    - "/home"
    - "/media"
    - "/mnt"
    - "/tmp/webdesk"

  # Defense-in-depth blocklist. NOTE: this is a denylist and therefore
  # inherently incomplete; the real boundary should be per-operation
  # whitelisting. Until then, block the most common credential material.
  forbidden_patterns:
    - ".ssh"
    - ".gnupg"
    - ".passwords"
    - ".aws"
    - ".netrc"
    - ".git-credentials"
    - ".pgpass"
    - ".kube"
    - ".docker"
    - "id_rsa"
    - "id_dsa"
    - "id_ecdsa"
    - "id_ed25519"
    - "*.key"
    - "*.pem"

  max_file_size: 104857600
  max_path_depth: 10
  audit_enabled: true

logging:
  level: "info"
  audit_path: "/var/log/webdesk/audit.log"

performance:
  max_concurrent_operations: 10
  operation_timeout_secs: 30

